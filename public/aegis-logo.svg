<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="64" y1="8" x2="64" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#021526" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="64" y1="36" x2="64" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Tactical Shield Contour -->
  <path 
    d="M64 12 L108 28 C108 72 88 102 64 116 C40 102 20 72 20 28 L64 12 Z" 
    fill="url(#shieldGrad)" 
    stroke="url(#cyanGlow)" 
    stroke-width="3" 
    stroke-linejoin="round"
  />

  <!-- Inner Inset Shield Trim -->
  <path 
    d="M64 22 L98 34 C98 68 82 94 64 105 C46 94 30 68 30 34 L64 22 Z" 
    fill="none" 
    stroke="#38bdf8" 
    stroke-width="1.5" 
    stroke-opacity="0.35" 
    stroke-dasharray="4 2"
  />

  <!-- Radar Sonar Arcs (Ocean Sentinel Sentinel sweep) -->
  <path 
    d="M44 48 A28 28 0 0 1 84 48" 
    stroke="#0ea5e9" 
    stroke-width="2" 
    stroke-linecap="round" 
    opacity="0.6"
  />
  <path 
    d="M38 42 A38 38 0 0 1 90 42" 
    stroke="#38bdf8" 
    stroke-width="1.8" 
    stroke-linecap="round" 
    opacity="0.4"
  />
  <path 
    d="M32 36 A48 48 0 0 1 96 36" 
    stroke="#06b6d4" 
    stroke-width="1.5" 
    stroke-linecap="round" 
    opacity="0.25"
  />

  <!-- Radar Scan Beam Pulse -->
  <circle cx="64" cy="64" r="26" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" fill="#0369a1" fill-opacity="0.15" />
  <circle cx="64" cy="64" r="14" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.6" fill="#0284c7" fill-opacity="0.25" />

  <!-- Central Tactical Maritime Star & Anchor Motif -->
  <!-- Vertical Anchor Shaft -->
  <line x1="64" y1="36" x2="64" y2="84" stroke="url(#cyanGlow)" stroke-width="3.5" stroke-linecap="round" />
  <!-- Horizontal Crossbar -->
  <line x1="48" y1="48" x2="80" y2="48" stroke="url(#cyanGlow)" stroke-width="3" stroke-linecap="round" />
  <!-- Top Ring -->
  <circle cx="64" cy="34" r="6" stroke="#38bdf8" stroke-width="2.5" fill="none" />
  
  <!-- Anchor Curved Flukes / Ocean Wave Crest -->
  <path 
    d="M42 72 C46 88 56 94 64 94 C72 94 82 88 86 72" 
    stroke="url(#cyanGlow)" 
    stroke-width="3.5" 
    stroke-linecap="round" 
    fill="none" 
  />
  <!-- Anchor Tips Arrowheads -->
  <polygon points="42,72 38,76 44,78" fill="#38bdf8" />
  <polygon points="86,72 90,76 84,78" fill="#38bdf8" />

  <!-- Center Glowing Sentinel Node -->
  <circle cx="64" cy="64" r="4.5" fill="#ffffff" filter="url(#neonBlur)" />
  <circle cx="64" cy="64" r="3" fill="#38bdf8" />
</svg>
